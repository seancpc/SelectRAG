# CPU 可跑的品質閘門(gauntlet 第 1–3 層 + 隨機順序):測試 + 覆蓋率 → mypy strict → ruff。
# 變異測試(約 80–100 分鐘)與真實執行層不在 CI,以 `bash tools/gauntlet.sh` 本機完整重跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Tests + coverage
        run: python -m pytest tests -p no:randomly --cov=selectrag --cov-branch --cov-report=term-missing
      - name: Type check (mypy strict)
        run: python -m mypy
      - name: Lint + format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Random test order
        run: python -m pytest tests -q -p randomly
