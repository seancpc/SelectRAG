# A 軸控制組:BM25 對第 1 批真 eval set(25 題,v1-batch1)
#
# 前置:chunks.jsonl 由語料建置產生(語料在 gitignore 區,只在有語料的機器可跑):
#   python3 tools/build_corpus.py data/corpus results/chunks.jsonl

experiment_id: bm25-ctx-tuned-full100
eval_set: data/eval/eval_v1.2_full100.json

retriever:
  type: bm25
  params:
    chunks: results/chunks.jsonl
    context_fields: [doc_title, heading_path]
    k1: 0.7   # 2026-09-01 網格搜尋高原區中點
    b: 0.5

k_values: [1, 3, 5, 10]

results_dir: results
