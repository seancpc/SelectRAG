# 合成資料的 baseline 實驗
#
# 用途:驗證 runner pipeline 端到端可跑通、格式定案。
# ⚠️ 這不是評測:題目為中性占位符,分數沒有領域意義。
# 真正的 A 軸 baseline(BM25)待語料與真 eval set 就緒後另建設定檔。

experiment_id: synthetic-baseline
eval_set: data/eval/eval_v0_synthetic.json

retriever:
  type: scripted            # 之後會有 bm25 / dense / hybrid
  params:
    script: data/eval/eval_v0_synthetic_retrievals.json

# 檢索深度:runner 會取 max(k_values) 作為 top_k 一次檢索
k_values: [1, 3, 5, 10]

results_dir: results
