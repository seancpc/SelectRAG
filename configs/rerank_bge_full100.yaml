# A 軸步驟 2:cross-encoder reranker 代表點(candidates=20、文本含 doc_title),base = hybrid 代表點
# 網格(candidates 10/20/30 × plain/ctx)與 hard negative 檢核由 tools/rerank_grid.py 產出
# 前置(桌機):results/chunks.jsonl、results/dense_index/bge_m3_ctx.npz、bge-reranker-v2-m3 @ 953dc6f6

experiment_id: rerank-bge-full100
eval_set: data/eval/eval_v1.2_full100.json

retriever:
  type: rerank
  params:
    candidates: 20
    model: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e   # 桌機首跑 2026-09-14 釘死(同 tools/rerank_grid.py DEFAULT_REVISION)
    chunks: results/chunks.jsonl
    context_fields: [doc_title]
    retriever:
      type: hybrid
      params:
        pool: 12
        rrf_k: 60
        retrievers:
          - type: bm25
            params:
              chunks: results/chunks.jsonl
              context_fields: [doc_title, heading_path]
              k1: 0.7
              b: 0.5
          - type: dense
            params:
              index: results/dense_index/bge_m3_ctx.npz
              model: BAAI/bge-m3
              revision: 5617a9f61b028005a4858fdac845db406aefb181

k_values: [1, 3, 5, 10]

results_dir: results
