# A 軸 chunking ablation:BM25 +脈絡調參(k1=0.7/b=0.5)+ 鄰塊擴展 window=2
# window=0 對照組 = configs/bm25_ctx_tuned_full100.yaml;擴展後截回 top_k,k 預算與對照組相同

experiment_id: bm25-ctx-tuned-w2-full100
eval_set: data/eval/eval_v1.2_full100.json

retriever:
  type: bm25
  params:
    chunks: results/chunks.jsonl
    context_fields: [doc_title, heading_path]
    k1: 0.7
    b: 0.5
    neighbor_window: 2

k_values: [1, 3, 5, 10]

results_dir: results
