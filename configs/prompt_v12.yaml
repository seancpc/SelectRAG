# B 軸 prompt 集:100 題經 A 軸推薦配置(hybrid + bge reranker,cand=20、ctx)取 top-3 組 prompt
# 產出:python3 tools/build_prompts.py configs/prompt_v12.yaml results/prompts_v12.jsonl(桌機,主 venv)
# retriever 段與 configs/rerank_bge_full100.yaml 相同;k_values 只為通過 runner 設定驗證,建 prompt 不用

experiment_id: prompt-v12
eval_set: data/eval/eval_v1.2_full100.json

retriever:
  type: rerank
  params:
    candidates: 20
    model: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    chunks: results/chunks.jsonl
    context_fields: [doc_title]
    retriever:
      type: hybrid
      params:
        pool: 12
        rrf_k: 60
        retrievers:
          - type: bm25
            params:
              chunks: results/chunks.jsonl
              context_fields: [doc_title, heading_path]
              k1: 0.7
              b: 0.5
          - type: dense
            params:
              index: results/dense_index/bge_m3_ctx.npz
              model: BAAI/bge-m3
              revision: 5617a9f61b028005a4858fdac845db406aefb181

k_values: [1, 3, 5, 10]
results_dir: results

prompt:
  top_k: 3
  chunks: results/chunks.jsonl
  # 模板只含結構與占位槽;回答語言與「僅依參考段落」是 §5.3 faithfulness 的前提
  system: "你是文件問答助理。只能依據使用者提供的參考段落作答,段落中沒有的資訊一律回答「參考資料未提及」;以繁體中文作答,不超過三句。"
  template: |
    問題:{question}

    參考段落:
    {context}
