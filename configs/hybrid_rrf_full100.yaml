# A 軸步驟 1:RRF hybrid 代表點(pool=12、rrf_k=60);網格與聯集上限由 tools/hybrid_grid.py 產出
# base:BM25 +脈絡調參(k1=0.7/b=0.5)+ bge-m3 +脈絡;兩者皆為各家族最佳組
# 前置(桌機):results/chunks.jsonl、results/dense_index/bge_m3_ctx.npz

experiment_id: hybrid-rrf-full100
eval_set: data/eval/eval_v1.2_full100.json

retriever:
  type: hybrid
  params:
    pool: 12   # 2026-09-14 網格高原(8~15)中點;rrf_k 三格不敏感取 60
    rrf_k: 60
    retrievers:
      - type: bm25
        params:
          chunks: results/chunks.jsonl
          context_fields: [doc_title, heading_path]
          k1: 0.7
          b: 0.5
      - type: dense
        params:
          index: results/dense_index/bge_m3_ctx.npz
          model: BAAI/bge-m3
          revision: 5617a9f61b028005a4858fdac845db406aefb181

k_values: [1, 3, 5, 10]

results_dir: results
