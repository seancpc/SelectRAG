# Gradio 雙欄對照 demo(2026-09-18):左右各選一個 preset(既有 runner 設定檔),同題並排檢索 + 生成
# 啟動:python3 tools/demo_app.py configs/demo.yaml --port 7860(桌機主 venv;需先在 :8000 起 vLLM GPTQ 伺服端)
presets:
  bm25_ctx_tuned: configs/bm25_ctx_tuned_full100.yaml     # 最無聊但最穩:零 GPU
  hybrid_rerank_bge: configs/rerank_bge_full100.yaml      # A 軸推薦
chunks: results/chunks.jsonl
eval_set: data/eval/eval_v1.2_full100.json
prompt:                       # prompt_id v15_noprefix(2026-09-22):v13_cite + **只加一條**禁 meta 前言。
                              # ★ 與 C 軸實驗 prompt(configs/prompt_v12.yaml)分岔自 v13;demo 不產生任何備忘錄數字,實驗數字不受影響
                              #
                              # ★ v16_noabsent 已作廢(2026-09-23 第七輪,§6.15):加「回答『參考資料未提及』之前
                              # 必須逐段確認…不得宣稱未提及」一條,棄答 22→66,其中 44 筆是**原本正常作答的題變成純棄答**,
                              # 原有 11 筆錯誤棄答零修復。機制:規則把棄答字樣在 system 裡再重複一次並把注意力
                              # 引向「找不到的可能性」,7B 量化模型的反應是更頻繁輸出被強調的字串,不是執行檢查。
                              # 「禁宣稱缺席」在 prompt 層對此模型不可行;錯誤棄答的守門走確定性層
                              # (support 表的棄答列 + 真值名次欄,已於 2026-09-22 建成)。
                              #
                              # v14_cite 作廢紀錄(§6.11):同時加兩條 + 引用規則被推離句尾 → 引用錯置 11→28。
                              # v13_cite 原文(v15 的回退點):
                              #   "你是文件問答助理。只能依據使用者提供的參考段落作答,段落中沒有的資訊一律回答「參考資料未提及」;以繁體中文作答,不超過三句。每句結尾以 [段落編號] 標明依據,一句可標多個(如 [1][3]);若段落無法回答,只寫「參考資料未提及」且不標引用。"
  prompt_id: v15_noprefix
  top_k: 3
  system: "你是文件問答助理。只能依據使用者提供的參考段落作答,段落中沒有的資訊一律回答「參考資料未提及」;以繁體中文作答,不超過三句。直接陳述答案,禁止以指涉參考段落或作答過程的語句開頭(例如「根據參考段落」、「參考段落中的信息顯示」、「依據上述資料」)。每句結尾以 [段落編號] 標明依據,一句可標多個(如 [1][3]);若段落無法回答,只寫「參考資料未提及」且不標引用。"
  template: |
    問題:{question}

    參考段落:
    {context}
llm:
  url: http://127.0.0.1:8000
  model: Qwen/Qwen2.5-7B-Instruct-GPTQ-Int4   # C 軸推薦;served model name 以 curl localhost:8000/v1/models 為準
  max_tokens: 256
  seed: 42
  timeout: 120
# 拒答門檻(2026-09-19 核准 B):preset → top-1 相關分數門檻,低於即不打 LLM 直接拒答。
# 數值由 tools/abstain_grid.py 在桌機網格搜尋取高原中點後填入,並在旁記錄量測時的 reranker revision 與分數 min/max。
# 2026-09-19 桌機網格(eval 100 + offcorpus_v2 60,grid 40,誤拒≤0.02 / 正確拒≥0.90):
#   hybrid_rerank_bge:reranker BAAI/bge-reranker-v2-m3 @953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e,分數為 sigmoid 機率
#     top-1 範圍 0.0000–0.9998;語料外 60 題(含 19 誘撈)在 0.103 以上全拒;高原 0.026–0.590,取中點 0.3076
#     5 折交叉驗證(seed 42):五折門檻全為 0.3076,held-out 平均誤拒 0.010 / 正確拒 1.000,零折無高原 → 門檻對抽樣不敏感
#   bm25_ctx_tuned:分數 6.7–166.9 隨查詢長度浮動;擴到 60 題後高原完全消失(19.03 那格誤拒 0.024 已超上限),
#     交叉驗證五折有三折搜不到門檻、平均正確拒 0.383 → 不掛門檻(最穩配置沒有可校準的信心,已量化)
abstain:
  hybrid_rerank_bge: 0.308

