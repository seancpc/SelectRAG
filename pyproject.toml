[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selectrag"
version = "0.1.0"
description = "單卡 RTX 4090 上的企業級 RAG 選型實驗"
readme = "README.md"
# 釘選 3.11:vLLM / TensorRT-LLM 生態支援最齊全(待 4090 桌機驗證)
requires-python = ">=3.11,<3.12"
# ★ 版本以 requirements*.txt 為單一真相源,本區必須鏡像同值(tests/test_smoke.py 會比對)
dependencies = [
    "pyyaml==6.0.2",
    "pydantic==2.13.5",
    "pypdf==6.16.2",
    "numpy==2.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "mypy==1.11.2",
    "ruff==0.6.9",
    "hypothesis==6.112.1",
    "pytest-randomly==3.15.0",
    "pip-audit==2.7.3",
    "types-PyYAML==6.0.12.20240917",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["selectrag"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/selectrag"]
branch = true

[tool.coverage.report]
show_missing = true
